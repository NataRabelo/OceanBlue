name: oceanblue-production
services:
  db:
    image: postgres:16@sha256:23af655ba1ddf74eaa002e3deaf5fce022ab8791672336a7c1fb0ef2d57efb7f
    environment:
      POSTGRES_DB: oceanblue
      POSTGRES_USER: oceanblue_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/database_owner_password
    secrets: [database_owner_password]
    volumes: [database:/var/lib/postgresql/data]
    networks: [backend]
    command: [postgres, -c, log_statement=none, -c, log_min_error_statement=panic, -c, log_parameter_max_length_on_error=0]
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}
  app:
    image: ${OCEANBLUE_IMAGE:?Use an immutable approved image digest}
    env_file: ${OCEANBLUE_ENV_FILE:?Private production environment file required}
    environment:
      FLASK_ENV: production
      FORCE_HTTPS: "true"
      RUN_MIGRATIONS: "false"
      TRUST_PROXY_HEADERS: "true"
      TRUSTED_PROXY_NETWORKS: "172.30.61.2/32"
      FEATURE_BOLETO: "false"
      FEATURE_FISCAL: "false"
      FEATURE_EXTERNAL_PROVIDERS: "false"
      STORAGE_ROOT: /app/instance/storage
    read_only: true
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:mode=1777,size=64m"]
    volumes: [files:/app/instance]
    networks: [backend]
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}
  proxy:
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, --no-check-certificate, "https://127.0.0.1:8443/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    image: ${OCEANBLUE_PROXY_IMAGE:?Use an approved nginx image digest}
    ports: ["443:8443"]
    read_only: true
    user: "101:101"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:mode=1777,size=32m"]
    volumes:
      - ./infra/production/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${OCEANBLUE_TLS_DIRECTORY:?TLS directory required}:/etc/oceanblue/tls:ro
    networks:
      backend:
        ipv4_address: 172.30.61.2
      edge: {}
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}
networks:
  backend:
    internal: true
    ipam:
      config: [{subnet: 172.30.61.0/24, ip_range: 172.30.61.128/25}]
  edge: {}
volumes:
  files: {}
  database: {}
secrets:
  database_owner_password:
    file: ${OCEANBLUE_DATABASE_PASSWORD_FILE:?Private database owner password file required}
