services:
  smoke:
    environment:
      TRUST_PROXY_HEADERS: "true"
      TRUSTED_PROXY_NETWORKS: 172.30.62.2/32
      METRICS_TOKEN: synthetic-metrics-token-32-characters-long
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:mode=1777,size=64m"]
    networks:
      test:
        aliases: [app]
  proxy:
    depends_on:
      smoke:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, --no-check-certificate, "https://127.0.0.1:8443/health"]
      interval: 3s
      timeout: 5s
      retries: 20
    image: nginxinc/nginx-unprivileged@sha256:7377697a821c131a924a7105fafbe7414db4e9fcc77a6f08f776f33f141ec3f8
    profiles: [smoke]
    read_only: true
    user: "101:101"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:mode=1777,size=32m"]
    volumes:
      - ./infra/production/nginx.conf:/etc/nginx/nginx.conf:ro
      - proof-tls:/etc/oceanblue/tls:ro
    networks:
      test:
        ipv4_address: 172.30.62.2
networks:
  test:
    internal: true
    ipam:
      config: [{subnet: 172.30.62.0/24, ip_range: 172.30.62.128/25}]
volumes:
  proof-tls: {}
