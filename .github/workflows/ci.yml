name: Sprint 1 verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build production from locked dependencies
        run: docker build -t oceanblue-production .
      - name: Reject missing production configuration before connecting to database
        run: sh scripts/validate_image.sh oceanblue-production
      - name: Install, validate all migrations and run full suite
        run: docker compose -f compose.test.yml up --build --abort-on-container-exit --exit-code-from test
      - name: Verify production entrypoint, Gunicorn and readiness
        run: |
          docker compose -f compose.test.yml --profile smoke up -d --build --wait --wait-timeout 120 smoke
          docker compose -f compose.test.yml --profile smoke exec -T smoke python -m scripts.validate_smoke
      - name: Collect evidence
        if: always()
        run: |
          mkdir -p artifacts
          docker compose -f compose.test.yml --profile smoke logs --no-color > artifacts/verification.log
          docker compose -f compose.test.yml cp test:/app/coverage.xml artifacts/coverage.xml || true
          docker compose -f compose.test.yml cp test:/tmp/junit.xml artifacts/junit.xml || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sprint-01-evidence
          path: artifacts/
      - name: Cleanup isolated test services
        if: always()
        run: docker compose -f compose.test.yml --profile smoke down -v
