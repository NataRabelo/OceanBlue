{% extends "bases/base_public.html" %}
{% block title %}OceanBlue - Senha{% endblock %}
{% block content %}
<main class="max-w-lg mx-auto p-8">
  <h1 class="text-2xl mb-6">{{ 'Redefinir senha' if reset else 'Alterar senha' }}</h1>
  <form method="POST" class="space-y-4">
    {% if reset %}
    <input type="hidden" name="login_csrf" value="{{ session.get('login_csrf', '') }}">
    <label for="token">Codigo recebido do administrador (valido por 15 minutos)</label>
    <input id="token" name="token" required autocomplete="off" class="input-field">
    {% else %}
    <input type="hidden" name="csrf_token" value="{{ request.cookies.get('csrf_access_token', '') }}">
    <label for="senha_atual">Senha atual</label>
    <input id="senha_atual" name="senha_atual" type="password" required autocomplete="current-password" class="input-field">
    {% endif %}
    <label for="nova_senha">Nova senha (12 a 128 caracteres)</label>
    <input id="nova_senha" name="nova_senha" type="password" required minlength="12" maxlength="128" autocomplete="new-password" class="input-field">
    <button type="submit" class="btn-submit">Salvar senha</button>
  </form>
</main>
{% endblock %}
