pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    log_format operational escape=json '{"event":"proxy_request","request_id":"$request_id","status":$status,"duration":$request_time}';
    access_log /dev/stdout operational;
    server {
        listen 9443 ssl;
        ssl_certificate /etc/oceanblue/tls/fullchain.pem;
        ssl_certificate_key /etc/oceanblue/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        location = /metrics {
            proxy_pass http://app:5000;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Request-ID $request_id;
        }
        location / { return 404; }
    }
    server {
        listen 8443 ssl;
        server_name _;
        ssl_certificate /etc/oceanblue/tls/fullchain.pem;
        ssl_certificate_key /etc/oceanblue/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 10m;
        location = /metrics { return 404; }
        location / {
            proxy_pass http://app:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Forwarded "";
            proxy_connect_timeout 3s;
            proxy_read_timeout 60s;
        }
    }
}
