name: oceanblue-sprint01
services:
  db-test:
    image: postgres:16@sha256:23af655ba1ddf74eaa002e3deaf5fce022ab8791672336a7c1fb0ef2d57efb7f
    environment:
      POSTGRES_DB: oceanblue_test
      POSTGRES_USER: oceanblue_test
      POSTGRES_PASSWORD: isolated-test-only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oceanblue_test -d oceanblue_test"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks: [test]
  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      TEST_DATABASE_URL: postgresql+psycopg2://oceanblue_test:isolated-test-only@db-test:5432/oceanblue_test
      FLASK_SKIP_DOTENV: "1"
    depends_on:
      db-test:
        condition: service_healthy
    networks: [test]
    command: ["sh", "-c", "python -m pip check && python -m scripts.inventory --check && python -m scripts.validate_migrations && python -m pytest --junitxml=/tmp/junit.xml"]
  smoke:
    profiles: [smoke]
    volumes: [smoke-files:/app/instance]
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://oceanblue_test:isolated-test-only@db-test:5432/oceanblue_test
      SECRET_KEY: isolated-smoke-session-secret-32-characters
      JWT_SECRET_KEY: isolated-smoke-jwt-secret-32-characters
      FIELD_ENCRYPTION_KEY: isolated-smoke-field-secret-32-characters
    depends_on:
      db-test:
        condition: service_healthy
    networks: [test]
networks:
  test:
    internal: true
volumes:
  smoke-files: {}
